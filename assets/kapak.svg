<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKapak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="softCashmere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cyanAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bgKapak)"/>

  <!-- Cabinet showcase pair with CNC precise handle groove -->
  <g filter="url(#cardShadow)">
    <rect x="180" y="160" width="210" height="660" rx="8" fill="url(#softCashmere)"/>
    <!-- CNC Router J-Grip -->
    <path d="M 180 160 Q 200 180 230 180 L 390 180 L 390 160 Z" fill="#0284c7" opacity="0.8"/>
    
    <rect x="410" y="160" width="210" height="660" rx="8" fill="url(#softCashmere)"/>
    <path d="M 410 160 L 570 160 Q 600 180 620 160 L 620 180 L 410 180 Z" fill="#0284c7" opacity="0.8"/>
  </g>

  <!-- Circuit / Precision Milling lines -->
  <rect x="210" y="220" width="150" height="540" rx="4" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="440" y="220" width="150" height="540" rx="4" fill="none" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Cyan luxury tag -->
  <rect x="240" y="860" width="320" height="34" rx="17" fill="rgba(15,23,42,0.85)" stroke="url(#cyanAcc)" stroke-width="1.5"/>
  <text x="400" y="882" fill="#38bdf8" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">ALEN CNC • MEMBRAN KAPAK</text>
</svg>
