<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="s2grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="800" fill="url(#s2grad)"/>

  <!-- Alen CNC Modern Membran & Soft Kapak Serisi -->
  <g transform="translate(1060, 100)">
    <rect x="0" y="0" width="760" height="420" rx="12" fill="#1e293b" stroke="rgba(56,189,248,0.2)" stroke-width="2"/>
    
    <!-- 4 soft cashmere cabinet doors with precision CNC J-handles -->
    <rect x="20" y="20" width="165" height="380" rx="6" fill="#cbd5e1"/>
    <rect x="205" y="20" width="165" height="380" rx="6" fill="#cbd5e1"/>
    <rect x="390" y="20" width="165" height="380" rx="6" fill="#cbd5e1"/>
    <rect x="575" y="20" width="165" height="380" rx="6" fill="#cbd5e1"/>

    <!-- J-Groove CNC profiling cuts -->
    <line x1="20" y1="375" x2="185" y2="375" stroke="#0284c7" stroke-width="4"/>
    <line x1="205" y1="375" x2="370" y2="375" stroke="#0284c7" stroke-width="4"/>
    <line x1="390" y1="375" x2="555" y2="375" stroke="#0284c7" stroke-width="4"/>
    <line x1="575" y1="375" x2="740" y2="375" stroke="#0284c7" stroke-width="4"/>

    <!-- Island with CNC machined details -->
    <rect x="-40" y="340" width="820" height="260" rx="14" fill="#0b1120" stroke="url(#cyanGlow)" stroke-width="2.5"/>
    <rect x="-40" y="340" width="820" height="35" rx="4" fill="#f8fafc"/>
  </g>

  <rect width="1000" height="800" fill="url(#s2grad)" opacity="0.9"/>
</svg>
