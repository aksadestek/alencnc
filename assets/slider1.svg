<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="s1grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56,189,248,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="800" fill="url(#s1grad)"/>
  <rect width="1920" height="800" fill="url(#grid)"/>

  <!-- High-Tech CNC Machining & Precision Door Showcase on the right -->
  <g transform="translate(1080, 80)">
    <!-- Back machine precision panel -->
    <rect x="0" y="0" width="740" height="640" rx="16" fill="#111827" stroke="rgba(56,189,248,0.2)" stroke-width="2"/>
    
    <!-- CNC Circuit Traces (like in Alen CNC Logo) -->
    <g stroke="url(#cyanGlow)" stroke-width="2" fill="none" opacity="0.6">
      <path d="M 40 100 L 140 100 L 180 140 L 260 140"/>
      <circle cx="260" cy="140" r="4" fill="#38bdf8"/>
      <path d="M 40 160 L 200 160 L 240 200 L 260 200"/>
      <circle cx="260" cy="200" r="4" fill="#38bdf8"/>
      <path d="M 40 220 L 160 220 L 210 270 L 260 270"/>
      <circle cx="260" cy="270" r="4" fill="#38bdf8"/>
    </g>

    <!-- Luxury CNC Router Engraved Double Door -->
    <rect x="290" y="60" width="380" height="540" rx="8" fill="#1e293b" stroke="url(#cyanGlow)" stroke-width="3"/>
    <line x1="480" y1="60" x2="480" y2="600" stroke="url(#cyanGlow)" stroke-width="2"/>
    
    <!-- Precision CNC Insets -->
    <rect x="320" y="100" width="130" height="200" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="320" y="340" width="130" height="220" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="510" y="100" width="130" height="200" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="510" y="340" width="130" height="220" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Handles in brushed steel -->
    <rect x="460" y="300" width="8" height="70" rx="4" fill="url(#metalSilver)"/>
    <rect x="492" y="300" width="8" height="70" rx="4" fill="url(#metalSilver)"/>

    <!-- CNC Precision Gear Accent -->
    <circle cx="150" cy="460" r="45" fill="none" stroke="rgba(203,213,225,0.2)" stroke-width="6" stroke-dasharray="12 8"/>
    <circle cx="150" cy="460" r="20" fill="none" stroke="url(#cyanGlow)" stroke-width="3"/>
  </g>

  <!-- Left gradient overlay for clear text contrast -->
  <rect width="1000" height="800" fill="url(#s1grad)" opacity="0.9"/>
</svg>
